# Example scheduled workflow. To use it, copy this file to
# .github/workflows/data-update.yml and add two repository secrets:
#   CONTACT_EMAIL   address sent in the User-Agent (required)
#   NCBI_API_KEY    optional, raises the E-utilities limit from 3 to 10 requests/second
#
# Collected data is kept in the Actions cache between runs and is never committed.
# Only the reports (no raw data, no abstracts) are uploaded as a build artifact.
name: data-update

on:
  schedule:
    - cron: "15 3 * * 1"   # Mondays 03:15 UTC
  workflow_dispatch:
    inputs:
      sample:
        description: "Fetch only N records per source (leave empty for a full run)"
        required: false

concurrency:
  group: data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Unit tests (mocked HTTP)
        run: python -m pytest tests/unit -q

      - name: Restore previously collected data
        uses: actions/cache@v4
        with:
          path: |
            data
            manifest.json
          key: tujya-data-${{ github.run_id }}
          restore-keys: tujya-data-

      - name: Preflight
        run: tujya preflight

      - name: Incremental update
        run: |
          if [ -n "${{ inputs.sample }}" ]; then
            tujya update --sample "${{ inputs.sample }}"
          else
            tujya update
          fi

      - name: Summary
        if: always()
        run: tujya summary

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-${{ github.run_number }}
          path: |
            data/reports/data_quality.md
            data/reports/data_quality.html
            data/csv/coverage.csv
            data/csv/source_agreement.csv
            LICENSES.md
            manifest.json
          retention-days: 30
